<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1e2035" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VHF 定位" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>VHF Triangulation — 野生動物追蹤</title>
  <!-- Tailwind config must come BEFORE the CDN script, variable is `tailwind` not `tailwindcss` -->
  <script>
    tailwind = {
      config: {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              surface: '#1e2035',
              'surface-alt': '#282a45',
              'surface-card': '#2f3255',
              accent: '#1a4a80',
              'accent-light': '#2560a0',
              highlight: '#e94560',
              'highlight-glow': '#ff6b81',
              emerald: '#10b981',
              'emerald-dark': '#065f46',
              text: '#ffffff',
              'text-dim': '#d0d0e0',
              'text-muted': '#a8a8c0',
            },
            boxShadow: {
              'glow-red': '0 0 20px rgba(233,69,96,0.3)',
              'glow-blue': '0 0 20px rgba(59,130,246,0.3)',
              'glow-green': '0 0 20px rgba(16,185,129,0.3)',
              'card': '0 4px 24px rgba(0,0,0,0.4)',
              'input': 'inset 0 2px 4px rgba(0,0,0,0.3)',
            }
          }
        }
      }
    };
  </script>
  <!-- Use pinned Tailwind v3 CDN to avoid v4 module injection issues -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #1e2035;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }

    .header-bg {
      background: linear-gradient(135deg, #282a45 0%, #2f3255 50%, #1a4a80 100%);
      position: relative; overflow: hidden;
    }
    .header-bg::before {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(ellipse at center, rgba(233,69,96,0.08) 0%, transparent 70%);
      animation: pulse 6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    .btn-calculate {
      background: linear-gradient(135deg, #e94560 0%, #c73e54 100%);
      position: relative; overflow: hidden;
    }
    .btn-calculate::after {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.1) 0%, transparent 60%);
      opacity: 0; transition: opacity 0.3s;
    }
    .btn-calculate:active::after { opacity: 1; }
    .card-block { transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .card-block:active { transform: scale(0.995); }
    .field-input:focus { box-shadow: 0 0 0 2px rgba(233,69,96,0.4), inset 0 2px 4px rgba(0,0,0,0.3); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .result-enter { animation: slideUp 0.35s ease-out; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px;
      border-radius: 9999px; font-size: 0.7rem; font-weight: 600;
      letter-spacing: 0.05em; text-transform: uppercase;
    }
    #map { z-index: 0; }
    .leaflet-control-zoom a { background: #2f3255 !important; color: #fff !important; border-color: #1a4a80 !important; }
    .leaflet-control-zoom a:hover { background: #3a3d65 !important; }
    .custom-marker-label {
      background: rgba(30,32,53,0.9); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px; padding: 3px 8px; color: #fff; font-size: 12px;
      font-weight: 700; white-space: nowrap; backdrop-filter: blur(4px);
    }
    .leaflet-popup-content-wrapper { background: #2f3255 !important; color: #fff !important; border-radius: 12px !important; box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important; }
    .leaflet-popup-tip { background: #2f3255 !important; }
    .leaflet-popup-content { margin: 10px 14px !important; font-size: 13px; }
    .leaflet-control-locate {
      background: #2f3255 !important; border: 2px solid rgba(255,255,255,0.2) !important;
      border-radius: 8px !important; width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .leaflet-control-locate:hover { background: #3a3d65 !important; }
  </style>
</head>
<body class="bg-surface text-text min-h-screen">
  <div id="root"></div>
  <div id="loading-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1e2035; display: flex; align-items: center; justify-content: center; z-index: 9999;">
    <div style="text-align: center;">
      <div style="width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.2); border-top: 4px solid #10b981; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
      <div style="color: #ffffff; font-size: 16px; font-weight: 500;">加載中...</div>
      <div style="color: #a8a8c0; font-size: 12px; margin-top: 8px;">若長時間未加載，請清除瀏覽器快取</div>
    </div>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </div>

  <script>
    // Global error handling
    window.addEventListener('error', (event) => {
      console.error('Global error:', event.error);
      const loader = document.getElementById('loading-screen');
      if (loader) {
        loader.innerHTML = '<div style="text-align: center;"><div style="color: #e94560; font-size: 20px; font-weight: bold; margin-bottom: 16px;">⚠️ 加載失敗</div><div style="color: #ffffff; font-size: 14px; margin-bottom: 8px;">' + (event.error?.message || '發生未知錯誤') + '</div><div style="color: #a8a8c0; font-size: 12px;">請檢查網路連線或清除瀏覽器快取後重試</div></div>';
      }
    });
  </script>

  <script src="./app.js"></script>

  <script>
    // Register Service Worker for offline PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const basePath = window.location.pathname.includes('/vhf-triangulation/') ? '/vhf-triangulation/' : './';
        navigator.serviceWorker.register(basePath + 'sw.js', { scope: basePath })
          .then((reg) => console.log('[PWA] Service Worker registered, scope:', reg.scope))
          .catch((err) => console.warn('[PWA] SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
